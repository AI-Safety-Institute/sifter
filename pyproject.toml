[project]
name = "sifter-build"
version = "0.5.0"
description = "CLI for building and managing Apptainer containers on HPC with SLURM integration and pluggable remote registry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["apptainer", "containers", "hpc", "singularity", "slurm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Clustering",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer==0.27.1",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "humanize==4.16.0",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
s3 = ["boto3==1.43.72"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "ruff==0.16.3",
    "ty==0.0.72",
    "prek==0.4.13"
]

[project.scripts]
sifter = "sifter.cli:app"

[project.urls]
Homepage = "https://github.com/AI-Safety-Institute/sifter"
Repository = "https://github.com/AI-Safety-Institute/sifter"
Issues = "https://github.com/AI-Safety-Institute/sifter/issues"
Changelog = "https://github.com/AI-Safety-Institute/sifter/blob/main/CHANGELOG.md"
Security = "https://github.com/AI-Safety-Institute/sifter/blob/main/SECURITY.md"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution is `sifter-build`; the import package / CLI stay `sifter`.
module-name = "sifter"

# Note: Shell scripts in src/sifter/scripts/ are included automatically
# since the directory has an __init__.py (is a Python package)

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sifter"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
